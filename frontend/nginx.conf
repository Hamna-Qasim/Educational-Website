server {
    listen 80;
    root /usr/share/nginx/html;
    index landingpage.html;

    # Send API calls to the backend container ("backend" = service name in docker-compose.yml)
    location /api/ {
        proxy_pass http://backend:3000;
    }

    # Everything else: the website files
    location / {
        try_files $uri $uri/ =404;
    }
}
