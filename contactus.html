<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="courses.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
</head>
<body>
    <nav>
        <div class="nav__logo">
            <a href="#">flou<span>RISH</span></a>
        </div>
        <ul class="nav__links">
            <li><a href="landingpage.html">Home</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li><a href="aboutus.html">About Us</a></li>
            <li><a href="contactus.html">Contact Us</a></li>
        </ul>
        <div class="nav__btns">
            <button class="btn"><a href="logsign.html">Log In</a></button>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="text-center" style="color: var(--terracotta); font-weight: 600;">Get in Touch</h2>
        <br>
        <br>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form class="p-4 shadow-lg rounded" style="background-color: var(--peach-cream);">
                    <div class="mb-3">
                        <label for="name" class="form-label" style="color: var(--olive-green); font-weight: 500;">Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Your Name" required style="background-color: transparent; border-color: var(--sage-fern);">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label" style="color: var(--olive-green); font-weight: 500;">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Your Email" required style="background-color: transparent; border-color: var(--sage-fern);">
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label" style="color: var(--olive-green); font-weight: 500;">Message</label>
                        <textarea class="form-control" id="message" rows="4" placeholder="Your Message" required style="background-color: transparent; border-color: var(--sage-fern);"></textarea>
                    </div>
                    <button type="submit" class="btn w-100" 
                    style="background-color: var(--sage-fern); color: var(--peach-cream); font-weight: 600; transition: 0.3s ease-in-out; border: 2px solid var(--sage-fern);"
                    onmouseover="this.style.backgroundColor='transparent'; this.style.color='var(--sage-fern)'; this.style.borderColor='var(--sage-fern)';"
                    onmouseout="this.style.backgroundColor='var(--sage-fern)'; this.style.color='var(--peach-cream)';">
                    Send Message
                 </button>
                </form>
            </div>
        </div>
    </div>
    <br>

    
    <footer>
        <p>In partnership with</p>
        <div class="footer-links">
            <a href="#"><i class='bx bxl-amazon'></i></a>
            <a href="#"><i class='bx bxs-book-reader'></i></a>
            <a href="#"><i class='bx bxs-edit-alt' ></i></a>
            <a href="#"><i class='bx bxl-slack' ></i></a>
        </div>
        <p>&copy; 2025 Flourish. All rights reserved.</p>
    </footer>
</body>
</html>
